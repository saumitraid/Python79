<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS-5</title>
    <style type="text/css">
        .mydv1{
            margin: 0 auto;
            width: 1100px;
            height: 350px;
            border: 1px solid #b50101;
            display: flex;
            flex-direction: row;
            justify-content: space-between;
        }
        .content{
            width: 350px;
            height: 350px;
            border: 1px solid #b50101;
        }
        .bg-red{
            background-color: rgb(255, 141, 141);
        }
        .bg-green{
            background-color: rgb(202, 255, 122);
        }
        .bg-blue{
            background-color: rgb(145, 145, 255);
        }
    </style>
</head>
<body>
    <div class="mydv1">
        <div class="content bg-blue">
            1
        </div>
        <div class="content bg-green">
            2
        </div>
        <div class="content bg-red">
            3
        </div>
    </div>
</body>
</html>
