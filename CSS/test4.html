<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS-4</title>
    <style type="text/css">
        /* ID selector */
        #dv1{
            width: 700px;
            height: 350px;
            background-color: aqua;
        }
        #dv2{
            width: 1200px;
            height: 500px;
            border: 2px solid #fd0101;
            background-color: azure;
        }
        #innerdv{
            width: 500px;
            height: 250px;
            border: 2px solid #fd0101;
        }
    </style>
</head>
<body>
    <div id="dv1">

    </div>
    <div id="dv2">
        <div id="innerdv">

        </div>
    </div>
</body>
</html>
